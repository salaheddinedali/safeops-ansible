---
- name: Deploy Concepts Techniques Energie website
  hosts: serverweb
  become: true

  tasks:
    - name: Install Nginx
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true

    - name: Ensure Nginx is running
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

    - name: Deploy website files
      ansible.builtin.copy:
        src: files/website/
        dest: /var/www/html/
        owner: www-data
        group: www-data
        mode: "0755"

    - name: Verify website availability
      ansible.builtin.uri:
        url: http://localhost
        status_code: 200
